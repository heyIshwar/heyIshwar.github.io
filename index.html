<style>
  :root{
    --bg: #0a0a0a;
    --surface: #121212;
    --border: #1f1f1f;
    --fg: #e8e8e3;
    --fg-dim: #b8b8b3;
    --muted: #6a6a66;
    --accent: #a3e635;
    --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:var(--sans); height:100%; overflow:hidden; }
  #root { height: 100vh; height: 100dvh; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); color: var(--fg); }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

  /* IDE shell */
  .ide-shell {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    min-height: 100%; height: 100%; display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 40px 1fr auto;
  }
  .ide-topbar {
    grid-column: 1 / -1; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: 0.5; justify-content: space-between; gap: 8px; min-height: 40px;
  }
  .ide-topbar-left, .ide-topbar-right { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .ide-topbar-left { flex: 1; overflow: hidden; }
  .ide-topbar-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ide-menu-btn {
    display: none; background: transparent; border: 1px solid var(--border);
    color: var(--fg-dim); font-family: var(--mono); font-size: 10px;
    padding: 4px 8px; border-radius: 3px; cursor: pointer; flex-shrink: 0;
  }
  .ide-sidebar {
    border-right: 1px solid var(--border); overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .ide-main {
    overflow: auto; padding: 40px 56px 80px; min-width: 0;
    -webkit-overflow-scrolling: touch;
  }
  .ide-backdrop {
    display: none; position: fixed; inset: 40px 0 0 0;
    background: rgba(0,0,0,0.55); z-index: 40;
  }
  .ide-footer {
    grid-column: 1 / -1; border-top: 1px solid var(--border);
    padding: 6px 16px 8px; font-family: var(--mono); font-size: 10px;
    color: var(--muted); display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 6px 16px; letter-spacing: 0.5;
  }
  .ide-footer-sponsors {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px;
    flex: 1 1 280px; justify-content: center; line-height: 1.5;
  }
  .hide-sm { display: inline; }
  .show-sm { display: none !important; }

  .doc-hero { font-size: 56px; font-weight: 400; letter-spacing: -1.2px; margin: 0; line-height: 1.05; }
  .doc-h2 { font-size: 36px; font-weight: 400; letter-spacing: -0.6px; margin: 0; }
  .doc-h2-post { font-size: 40px; font-weight: 400; letter-spacing: -0.8px; margin: 16px 0 0; line-height: 1.1; }
  .readme-hero-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .readme-kv-grid { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wire-row { display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; padding: 12px 16px; font-family: var(--mono); font-size: 12.5px; align-items: center; color: var(--fg-dim); text-decoration: none; cursor: pointer; }
  .github-head, .github-row { display: grid; grid-template-columns: 200px 1fr 80px 60px 90px; padding: 10px 16px; font-family: var(--mono); font-size: 12px; }
  .github-head { font-size: 10px; color: var(--muted); letter-spacing: 0.6px; text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--surface); }
  .github-row { padding: 11px 16px; color: var(--fg-dim); text-decoration: none; transition: background 120ms; }
  .github-meta { display: none; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
  .cmdk-overlay { padding-top: 12vh !important; padding-left: 16px !important; padding-right: 16px !important; }
  .cmdk-panel { width: 560px; max-width: 100%; }

  @media (max-width: 860px) {
    .ide-shell { grid-template-columns: 1fr; }
    .ide-menu-btn { display: inline-flex; align-items: center; }
    .hide-sm { display: none !important; }
    .show-sm { display: inline-flex !important; align-items: center; }
    .ide-sidebar {
      position: fixed; top: 40px; left: 0; bottom: 0; width: min(288px, 88vw);
      z-index: 50; background: var(--bg);
      transform: translateX(-105%); transition: transform 0.22s ease;
      box-shadow: none;
    }
    .ide-sidebar.open { transform: translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,0.45); }
    .ide-backdrop.open { display: block; }
    .ide-main { padding: 24px 16px 56px; grid-row: 2; }
    .ide-footer-sponsors { flex: 1 1 100%; justify-content: flex-start; font-size: 9px; }
    .doc-hero { font-size: clamp(2rem, 9vw, 3.25rem); letter-spacing: -0.04em; }
    .doc-h2 { font-size: clamp(1.55rem, 6vw, 2.25rem); }
    .doc-h2-post { font-size: clamp(1.65rem, 6.5vw, 2.5rem); }
    .readme-kv-grid { grid-template-columns: 1fr; }
    .wire-row { grid-template-columns: 1fr; gap: 6px; padding: 14px 16px; align-items: start; }
    .github-head { display: none; }
    .github-row {
      grid-template-columns: 1fr; gap: 4px; padding: 14px 16px;
      border-top: 1px solid var(--border);
    }
    .github-row:first-of-type { border-top: none; }
    .github-desc { white-space: normal; }
    .github-meta { display: flex !important; }
    .resume-pdf { height: min(62vh, 720px); }
    .blog-prose { font-size: 15px; }
    .blog-prose pre { padding: 12px; font-size: 0.82em; overflow-x: auto; }
    .blog-prose table { display: block; overflow-x: auto; white-space: nowrap; }
  }

  @media (max-width: 420px) {
    .ide-topbar { padding: 0 10px; font-size: 10px; }
    .ide-topbar-right .ide-palette-btn { padding: 4px 7px; }
    .ide-footer { font-size: 9px; padding: 8px 10px; }
    .ide-footer-sponsors { display: none; }
  }

  .pr-row:hover { background: color-mix(in oklab, var(--accent) 8%, transparent) !important; color: var(--fg) !important; }
  .project-card:hover { background: color-mix(in oklab, var(--accent) 5%, transparent); border-color: color-mix(in oklab, var(--accent) 35%, var(--border)) !important; }
  .readme-card:hover { background: color-mix(in oklab, var(--accent) 6%, transparent); border-color: color-mix(in oklab, var(--accent) 35%, var(--border)) !important; }
  .explorer-row:hover { background: color-mix(in oklab, var(--accent) 5%, transparent); }
  .resume-pdf {
    width: 100%; height: min(78vh, 920px); border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface); margin-top: 20px;
  }
  em { font-style: italic; }
  .blog-prose { font-size: 16px; line-height: 1.75; color: var(--fg-dim); animation: fadein 0.35s ease; }
  .blog-prose h1, .blog-prose h2, .blog-prose h3, .blog-prose h4 {
    color: var(--fg); font-weight: 500; letter-spacing: -0.02em; line-height: 1.25;
    margin: 2em 0 0.75em;
  }
  .blog-prose h1 { font-size: 1.75rem; }
  .blog-prose h2 { font-size: 1.45rem; }
  .blog-prose h3 { font-size: 1.2rem; }
  .blog-prose p { margin: 0 0 1.1em; }
  .blog-prose ul, .blog-prose ol { margin: 0 0 1.25em; padding-left: 1.4em; }
  .blog-prose li { margin: 0.35em 0; }
  .blog-prose a { color: var(--accent); text-decoration: none; }
  .blog-prose a:hover { text-decoration: underline; }
  .blog-prose img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); margin: 1.5em 0; display: block; }
  .blog-prose figure { margin: 1.5em 0; }
  .blog-prose pre, .blog-prose code {
    font-family: var(--mono); font-size: 0.88em;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  }
  .blog-prose code { padding: 0.15em 0.4em; }
  .blog-prose pre { padding: 16px; overflow: auto; line-height: 1.55; margin: 1.25em 0; }
  .blog-prose pre code { border: none; padding: 0; background: transparent; }
  .blog-prose blockquote {
    margin: 1.25em 0; padding: 0 0 0 1em; border-left: 2px solid var(--accent);
    color: var(--muted); font-family: var(--serif); font-style: italic;
  }
  .blog-prose hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .blog-prose table { width: 100%; border-collapse: collapse; margin: 1.25em 0; font-size: 0.92em; }
  .blog-prose th, .blog-prose td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .blog-prose th { color: var(--fg); background: var(--surface); }
</style>
</head>
