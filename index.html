<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ishwar.dev — portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --surface: #121212;
    --border: #1f1f1f;
    --fg: #e8e8e3;
    --fg-dim: #b8b8b3;
    --muted: #6a6a66;
    --accent: #a3e635;
    --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:var(--sans); height:100%; }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); color: var(--fg); }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }
  .pr-row:hover { background: color-mix(in oklab, var(--accent) 8%, transparent) !important; color: var(--fg) !important; }
  .project-card:hover { background: color-mix(in oklab, var(--accent) 5%, transparent); border-color: color-mix(in oklab, var(--accent) 35%, var(--border)) !important; }
  .readme-card:hover { background: color-mix(in oklab, var(--accent) 6%, transparent); border-color: color-mix(in oklab, var(--accent) 35%, var(--border)) !important; }
  em { font-style: italic; }
  .blog-prose { font-size: 16px; line-height: 1.75; color: var(--fg-dim); animation: fadein 0.35s ease; }
  .blog-prose h1, .blog-prose h2, .blog-prose h3, .blog-prose h4 {
    color: var(--fg); font-weight: 500; letter-spacing: -0.02em; line-height: 1.25;
    margin: 2em 0 0.75em;
  }
  .blog-prose h1 { font-size: 1.75rem; }
  .blog-prose h2 { font-size: 1.45rem; }
  .blog-prose h3 { font-size: 1.2rem; }
  .blog-prose p { margin: 0 0 1.1em; }
  .blog-prose ul, .blog-prose ol { margin: 0 0 1.25em; padding-left: 1.4em; }
  .blog-prose li { margin: 0.35em 0; }
  .blog-prose a { color: var(--accent); text-decoration: none; }
  .blog-prose a:hover { text-decoration: underline; }
  .blog-prose img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); margin: 1.5em 0; display: block; }
  .blog-prose figure { margin: 1.5em 0; }
  .blog-prose pre, .blog-prose code {
    font-family: var(--mono); font-size: 0.88em;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  }
  .blog-prose code { padding: 0.15em 0.4em; }
  .blog-prose pre { padding: 16px; overflow: auto; line-height: 1.55; margin: 1.25em 0; }
  .blog-prose pre code { border: none; padding: 0; background: transparent; }
  .blog-prose blockquote {
    margin: 1.25em 0; padding: 0 0 0 1em; border-left: 2px solid var(--accent);
    color: var(--muted); font-family: var(--serif); font-style: italic;
  }
  .blog-prose hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .blog-prose table { width: 100%; border-collapse: collapse; margin: 1.25em 0; font-size: 0.92em; }
  .blog-prose th, .blog-prose td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .blog-prose th { color: var(--fg); background: var(--surface); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js" crossorigin></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="blog-content.jsx"></script>
<script type="text/babel" src="variation-ide.jsx"></script>

<script type="text/babel" data-presets="react">
ReactDOM.createRoot(document.getElementById("root")).render(<VariationIDE />);
</script>
</body>
</html>
